[project]
name = "worksearch"
version = "0.1.0"
description = "Search my public repos by what a change did: BM25 and a fine-tuned bge-small, scored on held-out repos"
readme = "README.md"
authors = [
    { name = "Srikarmk", email = "srikarmks@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
worksearch = "worksearch.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
